{% extends 'base.html' %}
{% block content %}
<div class="p-3">
    <div class="container">
        <div class="row mt-3">
            <div class="col mx-auto mb-3">
                <h2>List of All Blogs</h2>
                <hr />
            </div>
        </div>
        <div class="row">
            {% for d in context.data %}
            <div class="col-md-4 col-lg-3 mb-2 ">
                <div class="p-2 card align-items-center pt-4">
                    {% if d.image %}
                    <img src="{{ d.image.url }}" alt="image" class="card-img-top rounded img-card-200">
                    {% endif %}
                    <div class="card-body text-center">
                        <h5>{{ d.name }}</h5>
                        <p class="mb-1">Price: ${{ d.price }}</p>
                        <small>{{ d.description }}</small>
                    </div>
                    <div class="btn">
                        <a class="btn btn-primary" href="{% url 'blog.show' id=d.id %}">Show This Blog</a>
                    </div>
                </div>
            </div>
            {% endfor %}
        </div>
    </div>
</div>
{% endblock content %}
