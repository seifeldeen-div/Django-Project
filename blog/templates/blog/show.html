{% extends 'base.html' %}
{% block content %}
<div class="p-3">
    <div class="container">
        <div class="row mt-3">
            <div class="col-md-6 mx-auto mb-3">
                <h2>{{ blog.name }}</h2>
                <hr />
                <p><b>Description:</b> {{ blog.description }}</p>
                <p><b>Price:</b> ${{ blog.price }}</p>
                <a class="btn btn-warning" href="{% url 'blog.edit' id=blog.id %}">EDIT</a>
                <form method="POST" action="{% url 'blog.delete' id=blog.id %}" class="d-inline">
                    {% csrf_token %}
                    <button class="btn btn-danger" type="submit">DELETE</button>
                </form>
            </div>
            <div class="col-md-6 mx-auto mb-3 text-center">
                {% if blog.image %}
                    <img src="{{ blog.image.url }}" class="rounded img-card-200" alt="image" />
                {% endif %}
            </div>
        </div>
    </div>
</div>
{% endblock content %}
