{% extends 'base.html' %}
{% block content %}
{% load static %}
<div class="p-3">
    <div class="container">
        <div class="row mt-3">
            <div class="col-md-6 mx-auto mb-3">
                <h2>{{ blog.name }}</h2>
                <hr />
                <p><b>Description:</b> {{ blog.description }}</p>
                <p><b>Price:</b> ${{ blog.price }}</p>
            </div>
            <div class="col-md-6 mx-auto mb-3 text-center">
                <img src="{% static blog.url %}" class="rounded" alt="image" />
            </div>
        </div>
    </div>
</div>
{% endblock content %}
